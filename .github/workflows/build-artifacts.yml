name: build-artifacts

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: firefox
            script: zip
            artifacts: |
              .output/*-firefox.zip
              .output/*-sources.zip
          - browser: chrome
            script: zip:chrome
            artifacts: .output/*-chrome.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ZIP
        run: pnpm run ${{ matrix.script }}

      - name: Upload ZIP
        uses: actions/upload-artifact@v7
        with:
          name: sidebery-${{ matrix.browser }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          include-hidden-files: true
